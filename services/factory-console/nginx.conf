server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { access_log off; default_type text/plain; return 200 "console ready\n"; }
    # Resolve on each request: the UI process starts even while operations is down.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $operations http://operations-service:8082;
    location = /readyz { proxy_pass $operations$request_uri; proxy_connect_timeout 2s; proxy_read_timeout 4s; }
    location /api/ {
        proxy_pass $operations$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 2s;
        proxy_cache off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
