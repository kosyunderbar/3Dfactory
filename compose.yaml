name: factory-dev

x-logging: &local-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/dev-stack.sh env}
      INGESTION_DB_PASSWORD: ${INGESTION_APP_PASSWORD:?Missing ingestion app password}
      INGESTION_MIGRATION_PASSWORD: ${INGESTION_MIGRATOR_PASSWORD:?Missing ingestion migration password}
      OPERATIONS_DB_PASSWORD: ${OPERATIONS_APP_PASSWORD:?Missing operations app password}
      OPERATIONS_MIGRATION_PASSWORD: ${OPERATIONS_MIGRATOR_PASSWORD:?Missing operations migration password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgresql/init-databases.psql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *local-logging

  ingestion-service:
    build:
      context: .
      dockerfile: infrastructure/spring.Dockerfile
      args:
        SERVICE: ingestion-service
    environment:
      INGESTION_DB_URL: jdbc:postgresql://postgres:5432/ingestion_db
      INGESTION_DB_USERNAME: ingestion_app
      INGESTION_DB_PASSWORD: ${INGESTION_APP_PASSWORD:?Missing ingestion app password}
      INGESTION_MIGRATION_USERNAME: ingestion_migrator
      INGESTION_MIGRATION_PASSWORD: ${INGESTION_MIGRATOR_PASSWORD:?Missing ingestion migration password}
      INGESTION_HTTP_ADDRESS: 0.0.0.0
      INGESTION_HTTP_PORT: 8081
      OPERATIONS_BASE_URL: http://operations-service:8082
      INGESTION_TCP_ADDRESS: 0.0.0.0
      INGESTION_TCP_PORT: 9090
      INGESTION_REJECTION_LOG: /var/log/factory/rejections.ndjson
    ports:
      - "127.0.0.1:${INGESTION_HTTP_PORT:-8081}:8081"
      - "127.0.0.1:${INGESTION_TCP_PORT:-9090}:9090"
    volumes:
      - ingestion-diagnostics:/var/log/factory
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/opt/probes", "HttpProbe", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 10s
    logging: *local-logging

  operations-service:
    build:
      context: .
      dockerfile: infrastructure/spring.Dockerfile
      args:
        SERVICE: operations-service
    environment:
      OPERATIONS_DB_URL: jdbc:postgresql://postgres:5432/operations_db
      OPERATIONS_DB_USERNAME: operations_app
      OPERATIONS_DB_PASSWORD: ${OPERATIONS_APP_PASSWORD:?Missing operations app password}
      OPERATIONS_MIGRATION_USERNAME: operations_migrator
      OPERATIONS_MIGRATION_PASSWORD: ${OPERATIONS_MIGRATOR_PASSWORD:?Missing operations migration password}
      OPERATIONS_HTTP_ADDRESS: 0.0.0.0
      OPERATIONS_HTTP_PORT: 8082
      INGESTION_DIAGNOSTIC_URL: http://ingestion-service:8081
    ports:
      - "127.0.0.1:${OPERATIONS_HTTP_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/opt/probes", "HttpProbe", "http://127.0.0.1:8082/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 10s
    logging: *local-logging

  factory-simulator:
    build: ./services/factory-simulator
    environment:
      INGESTION_TCP_HOST: ingestion-service
      INGESTION_TCP_PORT: 9090
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "factory_simulator", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 5s
    logging: *local-logging

  factory-console:
    build: ./services/factory-console
    ports:
      - "127.0.0.1:${CONSOLE_HTTP_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    logging: *local-logging

volumes:
  postgres-data:
  ingestion-diagnostics:
